<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="t d">
  <title id="t">Bharath Gopalsamy — Business Systems Developer and Application Support</title>
  <desc id="d">Banner with a map of connected business systems: intake, service desk, records, and reporting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#38BDF8"/>
    </marker>
    <style>
      .sans { font-family: 'Segoe UI', Inter, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace; }
      .node { fill: #0F172A; stroke: #334155; stroke-width: 1.5; }
      .live { stroke: #22D3EE; }
      .label { fill: #E2E8F0; font-size: 17px; font-weight: 600; }
      .sub { fill: #94A3B8; font-size: 13px; }
      .edge { stroke: #38BDF8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edge-dash { stroke: #475569; stroke-width: 2; fill: none; stroke-dasharray: 6 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect x="820" width="780" height="420" fill="url(#grid)" opacity="0.55"/>

  <!-- Left: identity -->
  <text x="80" y="112" class="mono" fill="#22D3EE" font-size="18">~/bharath $ whoami</text>
  <text x="80" y="182" class="sans" fill="#F8FAFC" font-size="58" font-weight="700">Bharath Gopalsamy</text>
  <rect x="80" y="204" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="80" y="252" class="sans" fill="#CBD5E1" font-size="26" font-weight="600">Business Systems Developer · Application Support</text>
  <text x="80" y="292" class="sans" fill="#94A3B8" font-size="20">I build and support the internal systems organizations run on:</text>
  <text x="80" y="320" class="sans" fill="#94A3B8" font-size="20">service desks, intake workflows, records and reporting.</text>
  <text x="80" y="372" class="mono" fill="#64748B" font-size="15">React · Node.js · SQL · REST APIs · Docker · Testing   |   Nova Scotia, Canada</text>

  <!-- Right: systems map -->
  <g class="sans">
    <rect x="900" y="70" width="190" height="66" rx="12" class="node live"/>
    <text x="920" y="100" class="label">Intake</text>
    <text x="920" y="121" class="sub">MaintainIQ · AI + review</text>

    <rect x="1180" y="70" width="210" height="66" rx="12" class="node live"/>
    <text x="1200" y="100" class="label">Service Desk</text>
    <text x="1200" y="121" class="sub">priority · SLA · workflow</text>

    <rect x="900" y="250" width="190" height="66" rx="12" class="node"/>
    <text x="920" y="280" class="label">Records</text>
    <text x="920" y="301" class="sub">admissions workflow</text>

    <rect x="1180" y="250" width="210" height="66" rx="12" class="node"/>
    <text x="1200" y="280" class="label">Reporting</text>
    <text x="1200" y="301" class="sub">SQL · Power BI</text>

    <path d="M1090 103 H1172" class="edge"/>
    <path d="M1285 136 V242" class="edge"/>
    <path d="M1090 283 H1172" class="edge-dash"/>
    <path d="M995 136 V242" class="edge-dash"/>

    <rect x="1420" y="84" width="104" height="36" rx="18" fill="#082F49" stroke="#22D3EE"/>
    <text x="1472" y="108" text-anchor="middle" fill="#67E8F9" font-size="14" font-weight="600">● live</text>
    <rect x="1420" y="264" width="104" height="36" rx="18" fill="#1E1B4B" stroke="#818CF8"/>
    <text x="1472" y="288" text-anchor="middle" fill="#A5B4FC" font-size="14" font-weight="600">○ building</text>
  </g>
</svg>
